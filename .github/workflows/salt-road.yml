name: salt-road
on:
  push:
    paths: ["salt-road.html", "salt-road/**", "tools/salt-road-build.mjs", ".github/workflows/salt-road.yml"]
  pull_request:
    paths: ["salt-road.html", "salt-road/**", "tools/salt-road-build.mjs", ".github/workflows/salt-road.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # salt-road.html must be exactly what salt-road/src builds, and its script must compile
      - run: node tools/salt-road-build.mjs --check
