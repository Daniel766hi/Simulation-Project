<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Salt Road: a top-down adventure. Explore the salt flats, talk to villagers, and recover the Rain Bell from the Salt Cathedral.">
<title>The Salt Road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap">
<style>
  /* One deliberate look: pixel art at dusk on the salt flats. Fixed palette for any host theme. */
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    color-scheme: dark;
    --night: #120f24;
    --panel: rgba(18, 15, 36, .86);
    --edge: #4b3f86;
    --text: #f3efe6;
    --muted: #b3aacb;
    --scarf: #3ee0e8;
    --gold: #ffcf4a;
    --heart: #ff4d6d;
    --font: "Pixelify Sans", "Courier New", monospace;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--night); color: var(--text); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; padding-inline: 16px; padding-block: 12px;
    overflow-x: hidden; -webkit-user-select: none; user-select: none;
  }
  .frame { position: relative; width: 100%; max-width: 1000px; }
  canvas#game { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 10px; background: #000; box-shadow: 0 0 0 2px var(--edge), 0 24px 60px -24px #000; touch-action: none; }

  .hud { position: absolute; inset: 10px 10px auto 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
  .hud-left { display: flex; flex-direction: column; gap: 6px; }
  .hearts { display: flex; gap: 3px; font-size: 22px; line-height: 1; filter: drop-shadow(0 2px 0 #000); }
  .hearts .h { color: var(--heart); }
  .hearts .h.empty { color: #3b3358; }
  .row { display: flex; gap: 10px; align-items: center; font-size: 15px; text-shadow: 0 2px 0 #000; }
  .row .coins { color: var(--gold); }
  .inv { display: flex; gap: 4px; flex-wrap: wrap; }
  .inv span { font-size: 12px; padding: 2px 6px; border-radius: 4px; background: var(--panel); border: 1px solid var(--edge); }
  .goal { max-width: 46%; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 7px 10px; font-size: 14px; line-height: 1.3; }
  .goal b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--scarf); margin-bottom: 2px; }
  #minimap { position: absolute; right: 10px; bottom: 10px; width: 144px; height: auto; image-rendering: pixelated; border: 1px solid var(--edge); border-radius: 6px; background: var(--panel); pointer-events: none; }

  .dialog { position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: 84px 1fr; gap: 12px; background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; padding: 12px; backdrop-filter: blur(2px); }
  .dialog canvas { width: 84px; height: 84px; image-rendering: pixelated; border-radius: 6px; background: #231d45; }
  .dialog .who { font-weight: 700; color: var(--scarf); font-size: 15px; margin-bottom: 4px; }
  .dialog .line { font-size: 16px; line-height: 1.4; min-height: 2.8em; }
  .dialog .opts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .dialog button { text-align: left; font: 500 15px var(--font); color: var(--text); background: rgba(255,255,255,.05); border: 1px solid var(--edge); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  .dialog button:hover, .dialog button.sel { background: rgba(62,224,232,.16); border-color: var(--scarf); }
  .dialog button:focus-visible { outline: 2px solid var(--gold); }
  .dialog .next { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }

  .toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 14px; font-size: 16px; text-align: center; max-width: 80%; pointer-events: none; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; background: radial-gradient(circle at 50% 40%, rgba(40,30,90,.72), rgba(10,8,22,.94)); border-radius: 10px; }
  .screen h1 { margin: 0; font-size: clamp(34px, 7vw, 64px); font-weight: 700; letter-spacing: .02em; color: var(--text); text-shadow: 0 4px 0 #2b2350, 0 0 30px rgba(62,224,232,.4); }
  .screen p { margin: 0; color: var(--muted); max-width: 44ch; line-height: 1.45; font-size: 16px; }
  .screen .big { font: 700 18px var(--font); color: #120f24; background: var(--scarf); border: 0; border-radius: 8px; padding: 10px 22px; cursor: pointer; box-shadow: 0 4px 0 #1b8f96; }
  .screen .big:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .screen .ghost { font: 500 14px var(--font); color: var(--muted); background: transparent; border: 1px solid var(--edge); border-radius: 8px; padding: 7px 14px; cursor: pointer; }

  .help { width: 100%; max-width: 1000px; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .help kbd { font: 500 12px var(--font); color: var(--text); background: #231d45; border: 1px solid var(--edge); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; }

  .touch { display: none; width: 100%; max-width: 1000px; justify-content: space-between; align-items: center; margin-top: 10px; gap: 12px; }
  .stick { width: 124px; height: 124px; border-radius: 50%; background: rgba(255,255,255,.05); border: 2px solid var(--edge); position: relative; touch-action: none; flex: none; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(62,224,232,.35); border: 2px solid var(--scarf); }
  .btns { display: flex; gap: 14px; align-items: center; }
  .btns button { width: 68px; height: 68px; border-radius: 50%; border: 2px solid var(--edge); background: rgba(255,255,255,.06); color: var(--text); font: 700 15px var(--font); touch-action: none; }
  .btns .a { background: rgba(62,224,232,.22); border-color: var(--scarf); width: 78px; height: 78px; }
  @media (pointer: coarse), (max-width: 640px) {
    .touch { display: flex; } .help { display: none; }
    .goal { font-size: 12px; max-width: 58%; } #minimap { width: 96px; }
    .dialog { grid-template-columns: 56px 1fr; } .dialog canvas { width: 56px; height: 56px; }
  }
</style>
</head>
<body>
<div class="frame" id="frame">
  <canvas id="game" aria-label="Game world"></canvas>
  <div class="hud">
    <div class="hud-left">
      <div class="hearts" id="hearts" aria-label="Health"></div>
      <div class="row"><span class="coins" id="coins">◆ 0</span><span class="inv" id="inv"></span></div>
    </div>
    <div class="goal" id="goal"><b>Goal</b><span id="goalText"></span></div>
  </div>
  <canvas id="minimap" width="72" height="54" aria-label="Minimap"></canvas>
  <div class="toast" id="toast" hidden></div>
  <div class="dialog" id="dialog" hidden>
    <canvas id="portrait" width="21" height="21"></canvas>
    <div>
      <div class="who" id="who"></div>
      <div class="line" id="line"></div>
      <div class="opts" id="opts"></div>
      <div class="next" id="next">E / Space to continue</div>
    </div>
  </div>
  <div class="screen" id="title">
    <h1>The Salt Road</h1>
    <p>Twelve dry days a year, the Glass Flats can be crossed. This year the Rain Bell was stolen, and without it the rains will drown Kessa. You are Sable, the last courier of the salt.</p>
    <button class="big" id="startBtn">Begin</button>
    <button class="ghost" id="newBtn" hidden>Start over</button>
  </div>
  <div class="screen" id="ending" hidden>
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <button class="big" id="againBtn">Play again</button>
  </div>
</div>
<div class="touch" id="touch">
  <div class="stick" id="stick" aria-label="Move"><i id="knob"></i></div>
  <div class="btns"><button id="bB" aria-label="Dash">DASH</button><button class="a" id="bA" aria-label="Talk or attack">ACT</button></div>
</div>
<div class="help">
  <span><kbd>WASD</kbd> / <kbd>←↑↓→</kbd> move</span>
  <span><kbd>E</kbd> talk</span>
  <span><kbd>Space</kbd> / <kbd>J</kbd> sword</span>
  <span><kbd>Shift</kbd> / <kbd>K</kbd> dash</span>
  <span><kbd>M</kbd> map</span>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TILE = 16, W = 72, H = 54;
  const VIEW_W = 320, VIEW_H = 192;               // low-resolution buffer, scaled up crisply

  // ------------------------------------------------------------------ tiles
  const T = { SALT: 0, SAND: 1, GRASS: 2, WATER: 3, PALM: 4, WALL: 5, FLOOR: 6, HOUSE: 7, ROOF: 8, DOOR: 9, PATH: 10,
              ROCK: 11, BRIDGE: 12, CRYSTAL: 13, DARK: 14, LOCKED: 15, WELL: 16, GATE: 17, LDOOR: 18, CITY: 19, PEDESTAL: 20 };
  const SOLID = new Set([T.WATER, T.PALM, T.WALL, T.HOUSE, T.ROOF, T.ROCK, T.CRYSTAL, T.LOCKED, T.WELL, T.GATE, T.CITY, T.DOOR, T.PEDESTAL]);
  const map = new Uint8Array(W * H).fill(T.SALT);
  const get = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? T.ROCK : map[y * W + x];
  const set = (x, y, t) => { if (x >= 0 && y >= 0 && x < W && y < H) map[y * W + x] = t; };
  const rect = (x0, y0, x1, y1, t) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, t); };
  const outline = (x0, y0, x1, y1, t) => { for (let x = x0; x <= x1; x++) { set(x, y0, t); set(x, y1, t); } for (let y = y0; y <= y1; y++) { set(x0, y, t); set(x1, y, t); } };
  const hash = (x, y) => { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; };
  function path(points) {
    for (let i = 1; i < points.length; i++) {
      let [x, y] = points[i - 1]; const [tx, ty] = points[i];
      while (x !== tx || y !== ty) { if (get(x, y) === T.SALT || get(x, y) === T.SAND || get(x, y) === T.GRASS) set(x, y, T.PATH); if (x !== tx) x += Math.sign(tx - x); else y += Math.sign(ty - y); }
      if ([T.SALT, T.SAND, T.GRASS].includes(get(tx, ty))) set(tx, ty, T.PATH);
    }
  }
  function house(x, y, w) { rect(x, y, x + w - 1, y + 1, T.ROOF); rect(x, y + 2, x + w - 1, y + 2, T.HOUSE); set(x + Math.floor(w / 2), y + 2, T.DOOR); }

  function buildMap() {
    map.fill(T.SALT);
    outline(0, 0, W - 1, H - 1, T.ROCK); outline(1, 1, W - 2, H - 2, T.ROCK);
    for (let i = 0; i < 70; i++) { const x = 2 + Math.floor(hash(i, 7) * (W - 4)), y = 2 + Math.floor(hash(i, 11) * (H - 4)); if (hash(i, 3) < .5 && (x < 5 || y < 4 || x > W - 6 || y > H - 5)) set(x, y, T.ROCK); }
    // Kessa village (south-west)
    rect(3, 33, 25, 51, T.SAND);
    house(5, 35, 6); house(15, 35, 7); house(4, 44, 5); house(17, 45, 5);
    set(12, 42, T.WELL);
    // Well of Nine oasis (centre)
    rect(31, 22, 41, 30, T.GRASS); rect(34, 25, 38, 27, T.WATER);
    for (const [x, y] of [[32, 23], [40, 23], [32, 29], [40, 29], [36, 22]]) set(x, y, T.PALM);
    // eastern palm grove
    rect(52, 32, 68, 50, T.GRASS); rect(58, 38, 63, 42, T.WATER);
    for (let i = 0; i < 40; i++) { const x = 52 + Math.floor(hash(i, 21) * 17), y = 32 + Math.floor(hash(i, 23) * 19); if (get(x, y) === T.GRASS && Math.abs(x - 55) + Math.abs(y - 36) > 3) set(x, y, T.PALM); }
    // river with a bridge
    rect(48, 2, 49, 30, T.WATER); set(48, 14, T.BRIDGE); set(49, 14, T.BRIDGE);
    // Salt Cathedral (north)
    outline(24, 3, 44, 19, T.WALL); rect(25, 4, 43, 18, T.DARK);
    for (let x = 25; x <= 43; x++) set(x, 11, T.WALL);
    set(34, 11, T.LOCKED); set(34, 19, T.LDOOR);
    for (const [x, y] of [[27, 13], [31, 16], [38, 13], [41, 16], [29, 6], [39, 6], [26, 9], [42, 9]]) set(x, y, T.CRYSTAL);
    set(34, 5, T.PEDESTAL);
    // Oru (north-east): city wall and gate
    rect(52, 2, 69, 9, T.CITY); rect(52, 10, 69, 10, T.WALL); set(61, 10, T.GATE);
    // roads
    path([[12, 34], [12, 29], [30, 29], [30, 26], [31, 26]]);
    path([[36, 22], [36, 21], [34, 21], [34, 20]]);
    path([[36, 21], [46, 21], [46, 14], [47, 14]]);
    path([[50, 14], [61, 14], [61, 11]]);
    path([[41, 28], [47, 28], [47, 32], [52, 32], [55, 35]]);
  }

  // Pre-render each tile (with a few variants) into a small atlas.
  const tileCache = new Map();
  function tileCanvas(t, v) {
    const key = t * 10 + v;
    if (tileCache.has(key)) return tileCache.get(key);
    const c = document.createElement("canvas"); c.width = c.height = TILE;
    const g = c.getContext("2d");
    const px = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    const rnd = (i) => hash(t * 97 + v * 13 + i, i * 7 + v);
    switch (t) {
      case T.SALT: px(0, 0, 16, 16, "#e9e4ee"); for (let i = 0; i < 6; i++) px(Math.floor(rnd(i) * 16), Math.floor(rnd(i + 9) * 16), 1, 1, "#d2cbe0");
        if (v === 1) { g.strokeStyle = "#cfc6de"; g.beginPath(); g.moveTo(2, 9); g.lineTo(6, 6); g.lineTo(11, 7); g.lineTo(14, 3); g.stroke(); }
        if (v === 2) { px(5, 5, 2, 2, "#ffffff"); px(10, 11, 1, 1, "#ffffff"); } break;
      case T.SAND: px(0, 0, 16, 16, "#e6c98f"); for (let i = 0; i < 7; i++) px(Math.floor(rnd(i) * 16), Math.floor(rnd(i + 5) * 16), 1, 1, i % 2 ? "#d4b374" : "#f2dca8"); break;
      case T.GRASS: px(0, 0, 16, 16, "#5fae62"); for (let i = 0; i < 8; i++) { const x = Math.floor(rnd(i) * 15), y = Math.floor(rnd(i + 3) * 14); px(x, y, 1, 2, "#7fcf6e"); } if (v === 2) { px(4, 6, 2, 2, "#ffd24a"); px(11, 10, 2, 2, "#ff8ab0"); } break;
      case T.WATER: px(0, 0, 16, 16, "#2f8fbf"); px(0, 0, 16, 3, "#3aa3d4"); px(2 + v * 3, 6, 5, 1, "#7fd0f0"); px(8 - v, 11, 4, 1, "#7fd0f0"); break;
      case T.PALM: px(0, 0, 16, 16, "#5fae62"); px(7, 6, 2, 10, "#8a5a33"); px(6, 10, 1, 1, "#6b4426");
        g.fillStyle = "#2f7d48"; [[1, 5, 6, 2], [9, 5, 6, 2], [3, 2, 4, 2], [9, 2, 4, 2], [6, 1, 4, 3]].forEach(r => g.fillRect(...r)); px(7, 4, 2, 2, "#8a5a33"); break;
      case T.WALL: px(0, 0, 16, 16, "#6b6390"); px(0, 0, 16, 2, "#8a82b0"); for (let y = 4; y < 16; y += 5) px(0, y, 16, 1, "#4f4872"); px(v * 4 + 2, 5, 1, 4, "#4f4872"); px(11 - v, 10, 1, 5, "#4f4872"); break;
      case T.FLOOR: px(0, 0, 16, 16, "#8d86ad"); break;
      case T.DARK: px(0, 0, 16, 16, "#3a3558"); px(0, 0, 16, 1, "#332f4e"); px(0, 0, 1, 16, "#332f4e"); if (v === 1) px(6, 7, 3, 2, "#48426a"); break;
      case T.HOUSE: px(0, 0, 16, 16, "#d9a86c"); px(0, 0, 16, 2, "#b98a52"); px(3, 5, 4, 4, "#5b4a8a"); px(4, 6, 2, 2, "#ffd98a"); px(10, 5, 4, 4, "#5b4a8a"); px(11, 6, 2, 2, "#ffd98a"); break;
      case T.ROOF: px(0, 0, 16, 16, "#b8473a"); for (let y = 2; y < 16; y += 4) px(0, y, 16, 1, "#8f3027"); px(0, 0, 16, 1, "#d8665a"); break;
      case T.DOOR: px(0, 0, 16, 16, "#d9a86c"); px(4, 2, 8, 14, "#6b3f24"); px(5, 3, 6, 13, "#8a5533"); px(9, 9, 1, 1, "#ffd24a"); break;
      case T.PATH: px(0, 0, 16, 16, "#d8c6a8"); for (let i = 0; i < 5; i++) px(Math.floor(rnd(i) * 14), Math.floor(rnd(i + 2) * 14), 2, 1, "#c4ae8a"); break;
      case T.ROCK: px(0, 0, 16, 16, "#e9e4ee"); g.fillStyle = "#8d86ad"; g.beginPath(); g.moveTo(1, 15); g.lineTo(4, 4); g.lineTo(9, 1); g.lineTo(14, 6); g.lineTo(15, 15); g.fill(); px(5, 5, 3, 2, "#b3acd0"); px(3, 13, 12, 2, "#6b6390"); break;
      case T.BRIDGE: px(0, 0, 16, 16, "#2f8fbf"); px(0, 2, 16, 12, "#9a6a3e"); for (let x = 0; x < 16; x += 4) px(x, 2, 1, 12, "#7a4f2b"); px(0, 2, 16, 1, "#c08a55"); break;
      case T.CRYSTAL: px(0, 0, 16, 16, "#3a3558"); g.fillStyle = "#9ef0f5"; g.beginPath(); g.moveTo(8, 1); g.lineTo(12, 8); g.lineTo(8, 15); g.lineTo(4, 8); g.fill(); px(7, 4, 2, 6, "#e8ffff"); px(10, 9, 3, 5, "#5fc7d6"); break;
      case T.LOCKED: px(0, 0, 16, 16, "#6b6390"); px(3, 1, 10, 15, "#4a3a22"); px(4, 2, 8, 13, "#7a5a2e"); px(6, 7, 4, 4, "#ffcf4a"); px(7, 8, 2, 2, "#2b2350"); break;
      case T.LDOOR: px(0, 0, 16, 16, "#6b6390"); px(3, 1, 10, 15, "#1b1633"); px(4, 1, 8, 2, "#2b2350"); break;
      case T.WELL: px(0, 0, 16, 16, "#e6c98f"); px(2, 5, 12, 10, "#8d86ad"); px(4, 7, 8, 6, "#2f8fbf"); px(2, 2, 2, 8, "#6b3f24"); px(12, 2, 2, 8, "#6b3f24"); px(2, 1, 12, 2, "#b8473a"); break;
      case T.GATE: px(0, 0, 16, 16, "#6b6390"); px(2, 0, 12, 16, "#3a2a1e"); for (let x = 3; x < 14; x += 3) px(x, 0, 1, 16, "#ffcf4a"); break;
      case T.CITY: px(0, 0, 16, 16, "#3b4f9a"); px(2 + v * 2, 3, 4, 13, "#5a70c0"); px(9, 6 - v, 5, 10, "#4a60b0"); px(3 + v * 2, 5, 2, 2, "#ffd98a"); px(10, 8, 2, 2, "#ffd98a"); px(0, 0, 16, 2, "#2a3a78"); break;
      case T.PEDESTAL: px(0, 0, 16, 16, "#3a3558"); px(3, 9, 10, 6, "#8d86ad"); px(4, 8, 8, 2, "#b3acd0"); break;
    }
    tileCache.set(key, c);
    return c;
  }
  const VARIANTS = { [T.SALT]: 3, [T.GRASS]: 3, [T.WATER]: 3, [T.WALL]: 3, [T.DARK]: 2, [T.CITY]: 3, [T.SAND]: 2 };

  // ------------------------------------------------------------------ state
  const START = { x: 12 * TILE + 8, y: 47 * TILE + 8 };
  let G;
  function freshGame() {
    return {
      stage: 0, flags: {}, inv: { sword: false, lantern: false, key: false, bell: false, charm: false },
      coins: 5, maxHp: 3, hp: 3,
      px: START.x, py: START.y, checkpoint: { ...START },
      bossDead: false,
    };
  }
  const player = { dir: "down", vx: 0, vy: 0, walk: 0, attack: 0, dash: 0, dashCd: 0, inv: 0, ghosts: [], scarf: [] };
  let enemies = [], particles = [], drops = [], popups = [];
  let mode = "title";          // title | play | dialog | ending
  let camX = 0, camY = 0, shake = 0, time = 0, showMap = true;

  // ------------------------------------------------------------------ NPCs
  const NPCS = [
    { id: "nadia", name: "Elder Nadia", x: 12, y: 39, look: { robe: "#6a58c0", hair: "#e8e4f0", skin: "#c98d63", extra: "staff" } },
    { id: "ilse", name: "Ilse the Smith", x: 19, y: 39, look: { robe: "#8a4b2e", hair: "#d24a2a", skin: "#f0c090", extra: "hammer" } },
    { id: "maru", name: "Maru", x: 36, y: 29, look: { robe: "#2f6f8f", hair: "#bfb8d8", skin: "#a8744f", extra: "blind" } },
    { id: "beno", name: "Beno", x: 55, y: 36, look: { robe: "#3f8a5a", hair: "#3a2a1e", skin: "#e0a878", extra: "cap", small: true } },
    { id: "ren", name: "Captain Ren", x: 61, y: 12, look: { robe: "#4a5a8a", hair: "#1b1633", skin: "#d9a070", extra: "spear" } },
    { id: "tam", name: "Tam", x: 7, y: 48, look: { robe: "#b8473a", hair: "#2b2350", skin: "#f2c39a" } },
    { id: "odo", name: "Odo", x: 22, y: 43, look: { robe: "#c9a227", hair: "#6b3f24", skin: "#8a5a33" } },

  function dialogFor(n) {

        return "maru_0";

      case "ren": return G.inv.bell ? "ren_bell" : "ren_0";

  }

  // ------------------------------------------------------------------ enemies
  function makeEnemy(kind, tx, ty, extra = {}) {
    const base = { mite: { hp: 2, speed: 22, r: 5, dmg: 1 }, wisp: { hp: 2, speed: 34, r: 5, dmg: 1 }, warden: { hp: 16, speed: 26, r: 11, dmg: 1 } }[kind];
    return { kind, x: tx * TILE + 8, y: ty * TILE + 8, hx: tx * TILE + 8, hy: ty * TILE + 8, vx: 0, vy: 0, hurt: 0, t: hash(tx, ty) * 10, state: "idle", timer: 2, ...base, maxHp: base.hp, ...extra };
  }
  function spawnWorld() {
    enemies = [];
    const mites = [[18, 26], [24, 20], [14, 18], [22, 12], [44, 36], [40, 44], [28, 40], [8, 22], [17, 14], [52, 22], [58, 20]];
    for (const [x, y] of mites) enemies.push(makeEnemy("mite", x, y));
    for (const [x, y] of [[29, 14], [36, 16], [42, 13], [27, 17]]) enemies.push(makeEnemy("wisp", x, y));
    if (G.flags.maruTask && G.flags.maruMitesLeft > 0) spawnMaruMites(G.flags.maruMitesLeft);
  }
  function spawnMaruMites(n = 3) {
    G.flags.maruMitesLeft = n;
    for (const [x, y] of [[33, 24], [39, 24], [39, 28]].slice(0, n)) enemies.push(makeEnemy("mite", x, y, { maru: true }));
    save();
  }
  function spawnBoss() {
    if (enemies.some(e => e.kind === "warden") || G.bossDead) return;
    enemies.push(makeEnemy("warden", 34, 6));
    toast("The Hollow Warden wakes!");
    shake = 6;
  }

  // ------------------------------------------------------------------ input
  const keys = {};
  const stick = { x: 0, y: 0 };
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
    if (e.repeat) return;
    keys[k] = true;
    if (mode === "dialog") {
      if (k === "e" || k === " " || k === "enter" || k === "j") dialogAdvance();
      if (["arrowup", "w"].includes(k)) moveSel(-1);
      if (["arrowdown", "s"].includes(k)) moveSel(1);
      if (/^[1-9]$/.test(k)) pickChoice(Number(k) - 1);
      return;
    }
    if (mode !== "play") { if ((k === "enter" || k === " ") && mode === "title") startGame(); return; }
    if (k === "e" || k === "enter") interact();
    if (k === " " || k === "j") attack();
    if (k === "shift" || k === "k") dash();
    if (k === "m") showMap = !showMap;
  });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

  // touch joystick and buttons
  const stickEl = $("stick"), knob = $("knob");
  let stickId = null;
  function stickMove(e) {
    const r = stickEl.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const max = r.width / 2 - 10, d = Math.hypot(dx, dy);
    if (d > max) { dx *= max / d; dy *= max / d; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    stick.x = Math.abs(dx) > 8 ? dx / max : 0; stick.y = Math.abs(dy) > 8 ? dy / max : 0;
  }
  stickEl.addEventListener("pointerdown", e => { stickId = e.pointerId; stickEl.setPointerCapture(e.pointerId); stickMove(e); });
  stickEl.addEventListener("pointermove", e => { if (e.pointerId === stickId) stickMove(e); });
  const stickEnd = () => { stickId = null; stick.x = stick.y = 0; knob.style.transform = ""; };
  stickEl.addEventListener("pointerup", stickEnd); stickEl.addEventListener("pointercancel", stickEnd);
  $("bA").addEventListener("pointerdown", e => { e.preventDefault(); if (mode === "dialog") dialogAdvance(); else if (mode === "play") { if (!interact()) attack(); } else if (mode === "title") startGame(); });
  $("bB").addEventListener("pointerdown", e => { e.preventDefault(); if (mode === "play") dash(); });

  // ------------------------------------------------------------------ player actions
  const tileAt = (x, y) => get(Math.floor(x / TILE), Math.floor(y / TILE));
  function blocked(x, y, r = 4) {
    for (const [dx, dy] of [[-r, -2], [r, -2], [-r, 3], [r, 3]]) {
      const t = tileAt(x + dx, y + dy);
      if (SOLID.has(t)) return t;
      if (t === T.LDOOR && !G.inv.lantern) return t;
    }
    return 0;
  }
  function nearestNpc() {
    let best = null, bd = 22;
    for (const n of NPCS) {
      if (n.id === "beno" && G.flags.benoFollows) continue;
      const d = Math.hypot(n.px - G.px, n.py - G.py);
      if (d < bd) { bd = d; best = n; }
    }
    return best;
  }
  function interact() {
    const n = nearestNpc();
    if (n) { n.dir = Math.abs(G.px - n.px) > Math.abs(G.py - n.py) ? (G.px > n.px ? "right" : "left") : (G.py > n.py ? "down" : "up"); openDialog(dialogFor(n)); return true; }
    if (G.bossDead && !G.inv.bell && Math.hypot(G.px - (34 * TILE + 8), G.py - (6 * TILE + 8)) < 24) {
      G.inv.bell = true; advance(4); toast("You took the Rain Bell!"); burst(G.px, G.py - 8, "#ffcf4a", 30); save(); updateHud(); return true;
    }
    return false;
  }
  function facing() { return { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[player.dir]; }
  function attack() {
    if (!G.inv.sword) { toast("You have no weapon yet."); return; }
    if (player.attack > 0) return;
    player.attack = 0.26;
    const [fx, fy] = facing();
    const hx = G.px + fx * 12, hy = G.py - 4 + fy * 12;
    for (const e of enemies) if (Math.hypot(e.x - hx, (e.y - (e.kind === "warden" ? 12 : 4)) - hy) < 14 + e.r && e.hurt <= 0) hitEnemy(e, fx, fy);
  }
  function hitEnemy(e, fx, fy) {
    e.hp -= 1; e.hurt = 0.3;
    const kb = e.kind === "warden" ? 40 : 160;
    e.vx += fx * kb; e.vy += fy * kb;
    burst(e.x, e.y - 6, e.kind === "mite" ? "#ffffff" : "#9ef0f5", 8);
    shake = Math.max(shake, e.kind === "warden" ? 4 : 2);
    if (e.hp <= 0) killEnemy(e);
  }
  function killEnemy(e) {
    e.dead = true;
    burst(e.x, e.y - 6, e.kind === "warden" ? "#9ef0f5" : "#ffffff", e.kind === "warden" ? 60 : 16);
    if (e.kind === "warden") { G.bossDead = true; shake = 10; toast("The Hollow Warden shatters. The Rain Bell rests on the pedestal."); save(); }
    else if (Math.random() < 0.7) drops.push({ x: e.x, y: e.y, kind: Math.random() < 0.25 ? "heart" : "coin", t: 0 });
    if (e.maru) { G.flags.maruMitesLeft = Math.max(0, (G.flags.maruMitesLeft || 1) - 1); if (G.flags.maruMitesLeft === 0) toast("The mites are gone. Return to Maru."); save(); }
  }
  function dash() {
    if (player.dashCd > 0 || player.dash > 0) return;
    player.dash = 0.18; player.dashCd = 0.6; player.inv = Math.max(player.inv, 0.25);
  }
  function hurtPlayer(dmg, fromX, fromY) {
    if (player.inv > 0 || mode !== "play") return;
    G.hp -= dmg; player.inv = 1.1; shake = 5;
    const d = Math.hypot(G.px - fromX, G.py - fromY) || 1;
    player.vx += (G.px - fromX) / d * 180; player.vy += (G.py - fromY) / d * 180;
    burst(G.px, G.py - 6, "#ff4d6d", 10);
    updateHud();
    if (G.hp <= 0) die();
  }
  function die() {
    toast("You collapse... and wake at the last safe place.");
    G.hp = G.maxHp; G.coins = Math.max(0, G.coins - 5);
    G.px = G.checkpoint.x; G.py = G.checkpoint.y; player.vx = player.vy = 0; player.inv = 1.5;
    enemies = enemies.filter(e => e.kind !== "warden");
    save(); updateHud();
  }

  // ------------------------------------------------------------------ dialogue
  let dlg = null, sel = 0, typed = 0;
  function openDialog(id) {
    if (!id || !D[id]) return;
    mode = "dialog"; dlg = D[id]; sel = 0; typed = REDUCED ? 999 : 0;
    $("dialog").hidden = false;
    renderDialog();
  }
  function renderDialog() {
    const npc = NPCS.find(n => n.id === dlg.who);
    $("who").textContent = npc ? npc.name : "Sign";
    $("line").textContent = dlg.text.slice(0, Math.floor(typed));
    const done = typed >= dlg.text.length;
    const opts = $("opts"); opts.innerHTML = "";
    if (done && dlg.choices) {
      dlg.choices.forEach((c, i) => {
        const b = document.createElement("button");
        const ok = !c.req || c.req();
        b.textContent = `${i + 1}. ${c.t}${!ok ? ` (needs ${c.reqText})` : ""}`;
        b.disabled = !ok; if (!ok) b.style.opacity = .45;
        if (i === sel) b.classList.add("sel");
        b.addEventListener("click", () => pickChoice(i));
        opts.appendChild(b);
      });
    }
    $("next").hidden = !done || !!dlg.choices;
    drawPortrait(npc);
  }
  function moveSel(d) { if (dlg && dlg.choices) { sel = (sel + d + dlg.choices.length) % dlg.choices.length; renderDialog(); } }
  function pickChoice(i) {
    if (!dlg || !dlg.choices || typed < dlg.text.length) return;
    const c = dlg.choices[i]; if (!c || (c.req && !c.req())) return;
    if (c.act) c.act();
    gotoNode(c.go);
  }
  function dialogAdvance() {
    if (!dlg) return;
    if (typed < dlg.text.length) { typed = dlg.text.length; renderDialog(); return; }
    if (dlg.choices) { pickChoice(sel); return; }
    const act = dlg.act, next = dlg.go;
    if (act) act();
    if (mode === "ending") { dlg = null; $("dialog").hidden = true; return; }
    gotoNode(next);
  }
  function gotoNode(id) {
    if (id && D[id]) { dlg = D[id]; sel = 0; typed = REDUCED ? 999 : 0; renderDialog(); return; }
    dlg = null; $("dialog").hidden = true; if (mode === "dialog") mode = "play";
    updateHud();
  }

  // ------------------------------------------------------------------ drawing: characters
  function shadeHex(hex, amt) {
    const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt))));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }
  function drawPerson(g, x, y, o) {
    const s = o.small ? 0.8 : 1;
    const bob = o.walking ? Math.round(Math.abs(Math.sin(o.walk * Math.PI * 2))) : Math.round(Math.sin(time * 2 + (o.bob || 0)) * 0.5 + 0.5);
    const X = Math.round(x), Y = Math.round(y) - bob;
    const px = (dx, dy, w, h, c) => { g.fillStyle = c; g.fillRect(X + Math.round(dx * s), Y + Math.round(dy * s), Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s))); };
    g.fillStyle = "rgba(20,14,40,.28)"; g.beginPath(); g.ellipse(X, Math.round(y) + 1, 6 * s, 2.2 * s, 0, 0, Math.PI * 2); g.fill();
    const leg = o.walking ? Math.round(Math.sin(o.walk * Math.PI * 2) * 2) : 0;
    const dark = "#1b1633";
    if (o.dir === "left" || o.dir === "right") { px(-2 + leg, -3, 2, 3, dark); px(1 - leg, -3, 2, 3, dark); }
    else { px(-3, -3 + (leg > 0 ? -1 : 0), 2, 3, dark); px(1, -3 + (leg < 0 ? -1 : 0), 2, 3, dark); }
    px(-5, -11, 10, 8, dark);
    px(-4, -11, 8, 8, o.robe);
    px(-4, -5, 8, 2, shadeHex(o.robe, -0.25));
    if (o.dir !== "up") px(-1, -10, 2, 6, shadeHex(o.robe, 0.2));
    const arm = o.walking ? Math.round(Math.sin(o.walk * Math.PI * 2 + Math.PI) * 1.5) : 0;
    if (o.dir === "down" || o.dir === "up") { px(-6, -10 + arm, 2, 5, o.robe); px(4, -10 - arm, 2, 5, o.robe); px(-6, -6 + arm, 2, 1, o.skin); px(4, -6 - arm, 2, 1, o.skin); }
    else px(o.dir === "right" ? -1 + arm : -1 - arm, -9, 2, 5, shadeHex(o.robe, -0.15));
    px(-5, -19, 10, 9, dark);
    px(-4, -18, 8, 8, o.hair);
    const eye = o.glowEyes ? "#9ef0f5" : dark;
    if (o.dir === "down") { px(-3, -16, 6, 5, o.skin); px(-2, -14, 1, 1, eye); px(1, -14, 1, 1, eye); }
    else if (o.dir === "left") { px(-4, -16, 4, 5, o.skin); px(-3, -14, 1, 1, eye); }
    else if (o.dir === "right") { px(0, -16, 4, 5, o.skin); px(2, -14, 1, 1, eye); }

    if (mode === "play") drawCompass(g, ox, oy);
    const vg = g.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.45, VIEW_W / 2, VIEW_H / 2, VIEW_W * 0.7);
    vg.addColorStop(0, "rgba(18,15,36,0)"); vg.addColorStop(1, "rgba(18,15,36,.45)");
    g.fillStyle = vg; g.fillRect(0, 0, VIEW_W, VIEW_H);

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(buf, 0, 0, canvas.width, canvas.height);
    if (showMap) drawMinimap(); else $("minimap").hidden = true;
  }
  function drawPrompt(g, x, y) { const b = Math.round(Math.sin(time * 6)); x = Math.round(x); y = Math.round(y); g.fillStyle = "#1b1633"; g.fillRect(x - 5, y - 6 + b, 10, 9); g.fillStyle = "#f3efe6"; g.fillRect(x - 4, y - 5 + b, 8, 7); g.fillStyle = "#1b1633"; g.font = "7px 'Pixelify Sans', monospace"; g.textAlign = "center"; g.fillText("E", x, y + 1 + b); }
  function drawMarker(g, x, y) { const b = Math.round(Math.sin(time * 5) * 2); x = Math.round(x); y = Math.round(y); g.fillStyle = "#1b1633"; g.fillRect(x - 2, y - 9 + b, 5, 11); g.fillStyle = "#ffcf4a"; g.fillRect(x - 1, y - 8 + b, 3, 6); g.fillRect(x - 1, y - 1 + b, 3, 2); }
  function drawChest(g, x, y) { x = Math.round(x); y = Math.round(y); g.fillStyle = "#1b1633"; g.fillRect(x - 7, y - 9, 14, 11); g.fillStyle = "#8a5533"; g.fillRect(x - 6, y - 8, 12, 9); g.fillStyle = "#ffcf4a"; g.fillRect(x - 6, y - 5, 12, 1); g.fillRect(x - 1, y - 6, 2, 3); if (Math.floor(time * 3) % 2) { g.fillStyle = "#ffffff"; g.fillRect(x + 5, y - 11, 1, 1); } }
  function drawSparkle(g, x, y, c) { x = Math.round(x); y = Math.round(y); const s = 2 + Math.round(Math.abs(Math.sin(time * 4)) * 3); g.fillStyle = c; g.fillRect(x - 1, y - 1, 3, 3); g.fillStyle = "#ffffff"; g.fillRect(x, y - s - 1, 1, s); g.fillRect(x, y + 2, 1, s); g.fillRect(x - s - 1, y, s, 1); g.fillRect(x + 2, y, s, 1); }
  function drawBell(g, x, y) { x = Math.round(x); y = Math.round(y) - 6 - Math.round(Math.sin(time * 3) * 2); g.fillStyle = "#1b1633"; g.fillRect(x - 6, y - 8, 12, 11); g.fillStyle = "#ffcf4a"; g.fillRect(x - 5, y - 7, 10, 9); g.fillRect(x - 6, y + 1, 12, 2); g.fillStyle = "#fff1b0"; g.fillRect(x - 3, y - 6, 2, 5); g.fillStyle = "#8a5533"; g.fillRect(x - 1, y + 3, 2, 2); }
  function drawCompass(g, ox, oy) {
    const t = goal(); if (!t.text) return;
    const gx = t.x * TILE + 8 - ox, gy = t.y * TILE + 8 - oy;
    if (gx > 8 && gx < VIEW_W - 8 && gy > 8 && gy < VIEW_H - 8) { if (!NPCS.some(n => n.x === t.x && n.y === t.y)) drawMarker(g, gx, gy - 14); return; }
    const cx = VIEW_W / 2, cy = VIEW_H / 2, a = Math.atan2(gy - cy, gx - cx);
    const kx = (VIEW_W / 2 - 16) / Math.abs(Math.cos(a) || 1e-6), ky = (VIEW_H / 2 - 16) / Math.abs(Math.sin(a) || 1e-6), k = Math.min(kx, ky);
    const x = cx + Math.cos(a) * k, y = cy + Math.sin(a) * k;
    g.save(); g.translate(Math.round(x), Math.round(y)); g.rotate(a);
    const pulse = 1 + Math.sin(time * 6) * 0.12; g.scale(pulse, pulse);
    g.fillStyle = "#1b1633"; g.beginPath(); g.moveTo(9, 0); g.lineTo(-6, -7); g.lineTo(-3, 0); g.lineTo(-6, 7); g.closePath(); g.fill();
    g.fillStyle = "#ffcf4a"; g.beginPath(); g.moveTo(7, 0); g.lineTo(-4, -5); g.lineTo(-2, 0); g.lineTo(-4, 5); g.closePath(); g.fill();
    g.restore();
    const dist = Math.round(Math.hypot(gx - (G.px - ox), gy - (G.py - oy)) / TILE);
    const ly = y > VIEW_H - 24 ? y - 11 : y + 14;
    g.font = "7px 'Pixelify Sans', monospace"; g.textAlign = "center";
    g.fillStyle = "#1b1633"; g.fillText(`${dist}m`, Math.round(x) + 1, Math.round(ly) + 1);
    g.fillStyle = "#ffcf4a"; g.fillText(`${dist}m`, Math.round(x), Math.round(ly));
  }
  const MINI = { [T.SALT]: "#e9e4ee", [T.SAND]: "#e6c98f", [T.GRASS]: "#5fae62", [T.WATER]: "#2f8fbf", [T.PALM]: "#2f7d48", [T.WALL]: "#6b6390", [T.DARK]: "#3a3558", [T.HOUSE]: "#d9a86c", [T.ROOF]: "#b8473a", [T.DOOR]: "#6b3f24", [T.PATH]: "#d8c6a8", [T.ROCK]: "#8d86ad", [T.BRIDGE]: "#9a6a3e", [T.CRYSTAL]: "#9ef0f5", [T.LOCKED]: "#ffcf4a", [T.WELL]: "#2f8fbf", [T.GATE]: "#ffcf4a", [T.LDOOR]: "#1b1633", [T.CITY]: "#3b4f9a", [T.PEDESTAL]: "#b3acd0" };
  let miniBase = null, miniDirty = true;
  function drawMinimap() {
    const c = $("minimap"); c.hidden = false;
    const m = c.getContext("2d");
    if (!miniBase || miniDirty) {
      miniBase = m.createImageData(W, H);
      for (let i = 0; i < W * H; i++) { const n = parseInt((MINI[map[i]] || "#000000").slice(1), 16); miniBase.data.set([n >> 16, (n >> 8) & 255, n & 255, 255], i * 4); }
      miniDirty = false;
    }
    m.putImageData(miniBase, 0, 0);
    const t = goal();
    if (t.text && Math.floor(time * 3) % 2) { m.fillStyle = "#ffcf4a"; m.fillRect(t.x - 1, t.y - 1, 3, 3); }
    m.fillStyle = "#ff4d6d"; m.fillRect(Math.floor(G.px / TILE) - 1, Math.floor(G.py / TILE) - 1, 3, 3);
    m.fillStyle = "#ffffff"; m.fillRect(Math.floor(G.px / TILE), Math.floor(G.py / TILE), 1, 1);
  }

  // ------------------------------------------------------------------ HUD / flow
  function updateHud() {
    $("hearts").innerHTML = Array.from({ length: G.maxHp }, (_, i) => `<span class="h${i < G.hp ? "" : " empty"}">♥</span>`).join("");
    $("coins").textContent = `◆ ${G.coins}`;
    const items = [G.inv.sword && "Sword", G.inv.lantern && "Lantern", G.inv.key && "Key", G.inv.charm && "Charm", G.inv.bell && "Rain Bell"].filter(Boolean);
    $("inv").innerHTML = items.map(i => `<span>${i}</span>`).join("");
    const t = goal();
    $("goalText").textContent = t.text;
    $("goal").hidden = !t.text;
  }
  function resize() {
    const frame = $("frame");
    frame.style.maxWidth = "1000px";
    const w = frame.clientWidth, coarse = matchMedia("(pointer: coarse), (max-width: 640px)").matches;
    const maxH = window.innerHeight - (coarse ? 190 : 80);
    const scale = Math.max(1, Math.min(w / VIEW_W, maxH / VIEW_H));
    const cssW = Math.floor(VIEW_W * scale);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssW * dpr * VIEW_H / VIEW_W);
    canvas.style.width = cssW + "px"; canvas.style.height = Math.round(cssW * VIEW_H / VIEW_W) + "px";
    frame.style.maxWidth = cssW + "px";
  }
  function save() { try { localStorage.setItem("salt-road-rpg", JSON.stringify(G)); } catch { /* storage unavailable */ } }
  function load() { try { return JSON.parse(localStorage.getItem("salt-road-rpg")); } catch { return null; } }

  function startGame() {
    $("title").hidden = true; mode = "play";
    updateHud();
    if (G.stage === 0 && !G.flags.intro) { G.flags.intro = true; toast("Find Elder Nadia. Follow the gold arrow."); }
  }
  function newGame() {
    G = freshGame(); buildMap(); miniDirty = true; spawnWorld(); drops = []; particles = [];
    player.scarf = []; player.ghosts = []; camX = G.px - VIEW_W / 2; camY = G.py - VIEW_H / 2;
    const b = NPCS.find(n => n.id === "beno"); b.px = b.x * TILE + 8; b.py = b.y * TILE + 8; b.walking = false;
    save(); updateHud();
  }
  function ending(kind) {
    mode = "ending";
    const good = kind === "ring";
    $("endTitle").textContent = good ? "The Gates Open" : "The Guild's Coin";
    $("endText").textContent = good
      ? `The Bell's note rolls across the Flats. Oru's gates swing wide, and the people of Kessa walk to high ground as the first rain falls.${G.flags.benoFollows ? " Beno rides on your shoulders the whole way." : ""} Couriers will tell of Sable for a hundred dry seasons.`
      : "The Guild pays in gold. The gates stay shut. You watch from a dry balcony in Oru as the rains roll over the Flats toward Kessa. You never deliver anything again.";
    $("ending").hidden = false;
    try { localStorage.removeItem("salt-road-rpg"); } catch { /* storage unavailable */ }
  }
  $("startBtn").addEventListener("click", startGame);
  $("newBtn").addEventListener("click", () => { newGame(); startGame(); });
  $("againBtn").addEventListener("click", () => { $("ending").hidden = true; newGame(); startGame(); });

  // ------------------------------------------------------------------ boot
  newGame();
  const saved = load();
  if (saved && saved.stage !== undefined && saved.stage > 0) {
    Object.assign(G, saved);
    if (G.flags.unlocked) set(34, 11, T.DARK);
    miniDirty = true; spawnWorld();
    camX = G.px - VIEW_W / 2; camY = G.py - VIEW_H / 2;
    $("startBtn").textContent = "Continue"; $("newBtn").hidden = false;
  }
  updateHud(); resize();
  addEventListener("resize", resize);
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
